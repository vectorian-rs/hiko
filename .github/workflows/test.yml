name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["", "--all-features"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      # --locked: a Cargo.lock that no longer matches the manifests fails the run.
      - name: cargo test ${{ matrix.features }}
        run: cargo +1.99.1 test --workspace --locked ${{ matrix.features }}
