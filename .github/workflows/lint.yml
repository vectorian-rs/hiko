name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1 with rustfmt and clippy
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: cargo fmt and clippy
        run: scripts/lint.sh
        env:
          RUST_TOOLCHAIN: 1.99.1
