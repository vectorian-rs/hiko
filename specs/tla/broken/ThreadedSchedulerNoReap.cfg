\* Negative check for ThreadedSchedulerImpl.tla: a terminating parent does
\* not remove its children's tombstones at scope exit, so the tombstone of a
\* child that terminated after its parent reached it outlives the parent.
\* BoundedTombstones must fail.
INIT Init
NEXT Next

CONSTANTS
    MaxProcesses = 2
    MaxIo = 1
    Workers = {"w1", "w2"}
    RecheckAfterPark = TRUE
    ReapTombstones = FALSE

INVARIANT SafetyInvariant
