\* Negative check for ThreadedSchedulerImpl.tla: a waiter parks without
\* rechecking whether its child terminated while it was registering. A child
\* that terminates in that window finds the waiter in flight and skips it, so
\* the waiter is never woken. NoLostWakeup must fail.
INIT Init
NEXT Next

CONSTANTS
    MaxProcesses = 2
    MaxIo = 1
    Workers = {"w1", "w2"}
    RecheckAfterPark = FALSE
    ReapTombstones = TRUE

INVARIANT SafetyInvariant
