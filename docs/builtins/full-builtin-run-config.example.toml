# Proposed builtin-granular run config.
#
# This file is a reference example for the target capability tree shape we
# discussed. Leaf names correspond to builtins (or to stable public names when
# we choose to wrap/rename an internal builtin later).
#
# General rules:
# - Each leaf uses `enabled = true|false`.
# - Filesystem leaves use `folders = [...]`.
#   Each listed folder grants recursive access to everything below it.
# - HTTP leaves use `allowed_hosts = [...]`.
# - Exec leaves use `allowed_commands = [...]`; the exec timeout is
#   `[limits] exec_timeout_ms`.

entry = "scripts/example.hml"

[limits]
max_work = 100_000_000
max_memory_bytes = 268435456
max_io_bytes = 67108864
max_host_work = 10_000_000
max_host_resources = 32
max_heap = 1_000_000
# Fuel (max_work), memory, I/O bytes and host work are budgets for the whole
# process tree: spawned processes draw from the same counters as the root.
max_live_processes = 10_000             # spawned processes alive at once
max_spawns = 1_000_000                  # processes spawned in total (default: unlimited)
max_message_bytes = 67_108_864          # largest serialized spawn capture or child result

# Per-operation I/O limits. Each bounds one builtin call; values shown are the
# defaults used when a key is omitted. Byte limits also stay within the
# remaining `max_io_bytes` budget, whichever is smaller.
http_timeout_ms = 30_000                # whole request, including the body
http_connect_timeout_ms = 10_000
exec_timeout_ms = 30_000                # wall clock; kills the process group
max_http_response_bytes = 67_108_864    # one response body
max_file_read_bytes = 67_108_864        # one file read
max_exec_output_bytes = 16_777_216      # each of stdout and stderr
max_concurrent_io = 32                  # async I/O running at once per process tree

# [limits.host_resources] caps opaque native resources per kind. No host
# resource kind exists today, so the table is omitted.

# Standard input/output builtins.
[capabilities.stdio.print]
enabled = true

[capabilities.stdio.println]
enabled = true

[capabilities.stdio.eprint]
enabled = true

[capabilities.stdio.eprintln]
enabled = true

[capabilities.stdio.read_line]
enabled = true

[capabilities.stdio.read_stdin]
enabled = true

# Conversion builtins.
[capabilities.int.to_string]
enabled = true

[capabilities.float.to_string]
enabled = true

[capabilities.int.of_string]
enabled = true

[capabilities.char.to_int]
enabled = true

[capabilities.char.of_int]
enabled = true

[capabilities.float.of_int]
enabled = true

# String/text builtins.
[capabilities.string.length]
enabled = true

[capabilities.string.substring]
enabled = true

[capabilities.string.contains]
enabled = true

[capabilities.string.trim]
enabled = true

[capabilities.string.split]
enabled = true

[capabilities.string.replace]
enabled = true

[capabilities.string.starts_with]
enabled = true

[capabilities.string.ends_with]
enabled = true

[capabilities.string.upper]
enabled = true

[capabilities.string.lower]
enabled = true

[capabilities.string.join]
enabled = true

# Regex builtins.
[capabilities.regex.matches]
enabled = true

[capabilities.regex.replace]
enabled = true

# JSON builtins.
[capabilities.json.parse]
enabled = true

[capabilities.json.to_string]
enabled = true

[capabilities.json.get]
enabled = true

[capabilities.json.keys]
enabled = true

[capabilities.json.length]
enabled = true

# Math builtins.
[capabilities.float.sqrt]
enabled = true

[capabilities.int.abs]
enabled = true

[capabilities.float.abs]
enabled = true

[capabilities.float.floor]
enabled = true

[capabilities.float.ceil]
enabled = true

# Bytes builtins.
[capabilities.bytes.length]
enabled = true

[capabilities.bytes.to_string]
enabled = true

[capabilities.bytes.of_string]
enabled = true

[capabilities.bytes.get]
enabled = true

[capabilities.bytes.slice]
enabled = true

# Hash and randomness builtins.
[capabilities.hash.blake3.hash]
enabled = true

[capabilities.random.entropy]
enabled = true

[capabilities.random.seed]
enabled = true

[capabilities.random.bytes]
enabled = true

[capabilities.random.int_between]
enabled = true

# Environment and time builtins.
[capabilities.env.get]
enabled = true

[capabilities.time.epoch]
enabled = true

[capabilities.time.now]
enabled = true

[capabilities.time.monotonic_now]
enabled = true

[capabilities.time.sleep]
enabled = true

# Structured concurrency builtins.
[capabilities.fiber.spawn]
enabled = true

# Bulk joins grant only accepted-child await/cancel/reap authority.
[capabilities.fiber.join_all]
enabled = true

[capabilities.fiber.join_or_fail]
enabled = true

[capabilities.fiber.join]
enabled = true

# Pure path helper builtin.
[capabilities.path.join]
enabled = true

# Filesystem builtins.
# `folders` are recursive directory allowlists for that builtin.

[capabilities.filesystem.read_text]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.read_bytes]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.write_text]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.exists]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.list_entries]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.remove]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.create_directory]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.is_directory]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.is_regular_file]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.glob_matches]
enabled = true
folders = ["./workspace"]

[capabilities.filesystem.walk]
enabled = true
folders = ["./workspace"]

# HTTP builtins.
# `allowed_hosts` are host allowlists enforced for each builtin. The host is
# read with the HTTP client's own URL parser, so the host checked is the host
# connected to. It must be a DNS name (compared in lowercase) or a bracketed
# IPv6 address such as "[::1]"; write internationalized names in punycode
# ("xn--..."). Other forms, such as percent-encoded hosts, are refused.

[capabilities.http.client.get]
enabled = true
allowed_hosts = ["api.example.com"]

[capabilities.http.client.request]
enabled = true
allowed_hosts = ["api.example.com"]

[capabilities.http.client.request_json]
enabled = true
allowed_hosts = ["api.example.com"]

[capabilities.http.client.request_msgpack]
enabled = true
allowed_hosts = ["api.example.com"]

[capabilities.http.client.request_bytes]
enabled = true
allowed_hosts = ["api.example.com"]

# Command execution builtin.
# `allowed_commands` may be launched with any arguments; an `allow` rule
# allows one command only with the given arguments (`rest = "any"`: as a
# prefix). See "Exec policy" in builtins.md.
# The timeout is `[limits] exec_timeout_ms`.

[capabilities.exec.run]
enabled = true
allowed_commands = ["git", "cargo"]

[[capabilities.exec.run.allow]]
argv = ["terraform", "plan", "-input=false"]

[[capabilities.exec.run.allow]]
argv = ["terraform", "show", "--"]
rest = "any"

# System/testing builtins.
[capabilities.system.exit]
enabled = true

[capabilities.system.panic]
enabled = true

[capabilities.testing.check]
enabled = true

[capabilities.testing.equal]
enabled = true
