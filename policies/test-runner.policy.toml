[limits]
max_fuel = 100_000_000
max_heap = 1_000_000
exec_timeout_ms = 30000

[capabilities.stdio.println]
enabled = true

[capabilities.int.to_string]
enabled = true

[capabilities.string.starts_with]
enabled = true

[capabilities.string.ends_with]
enabled = true

[capabilities.string.substring]
enabled = true

[capabilities.string.length]
enabled = true

[capabilities.string.trim]
enabled = true

[capabilities.env.get]
enabled = true

[capabilities.time.monotonic_now]
enabled = true

[capabilities.filesystem.exists]
enabled = true
folders = ["."]

[capabilities.filesystem.glob_matches]
enabled = true
folders = ["."]

[capabilities.exec.run]
enabled = true
allowed_commands = [
  "./target/release/hiko-cli",
  "./target/release/hiko-vm-hiko-run-all-policy",
  "./hiko-vm-hiko-run-all-policy/target/release/hiko-vm-hiko-run-all-policy",
]

[capabilities.system.panic]
enabled = true
