# Benchmark policy, used by bun scripts/bench.ts.
# No fuel limit, so the interpreter benchmarks measure the interpreter, not
# the budget. Read-only filesystem access under . for the I/O workloads.

[limits]
max_heap = 10_000_000

[capabilities.stdio.print]
enabled = true

[capabilities.stdio.println]
enabled = true

[capabilities.int.to_string]
enabled = true

[capabilities.float.of_int]
enabled = true

[capabilities.float.floor]
enabled = true

[capabilities.float.sqrt]
enabled = true

[capabilities.string.length]
enabled = true

[capabilities.string.substring]
enabled = true

[capabilities.string.join]
enabled = true

[capabilities.regex.matches]
enabled = true

[capabilities.regex.replace]
enabled = true

[capabilities.int.abs]
enabled = true

[capabilities.bytes.length]
enabled = true

[capabilities.hash.blake3.hash]
enabled = true

[capabilities.time.monotonic_now]
enabled = true

[capabilities.testing.equal]
enabled = true

[capabilities.fiber.spawn]
enabled = true

[capabilities.fiber.join_or_fail]
enabled = true

[capabilities.fiber.join]
enabled = true

[capabilities.fiber.cancel]
enabled = true

[capabilities.fiber.wait_any]
enabled = true

# Owned bulk joins have independent authority; no individual leaf is implied.
[capabilities.fiber.join_all]
enabled = true

[capabilities.filesystem.read_text]
enabled = true
folders = ["."]

[capabilities.filesystem.read_bytes]
enabled = true
folders = ["."]

[capabilities.filesystem.walk]
enabled = true
folders = ["."]
