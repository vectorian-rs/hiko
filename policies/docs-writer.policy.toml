# Documentation role policy.
# Read the whole repo, but only write under ./docs.

[limits]
max_fuel = 20_000_000
max_heap = 250_000

[capabilities.stdio.println]
enabled = true

[capabilities.stdio.read_stdin]
enabled = true

[capabilities.int.to_string]
enabled = true

[capabilities.int.of_string]
enabled = true

[capabilities.string.length]
enabled = true

[capabilities.string.substring]
enabled = true

[capabilities.string.contains]
enabled = true

[capabilities.string.trim]
enabled = true

[capabilities.string.split]
enabled = true

[capabilities.string.replace]
enabled = true

[capabilities.string.starts_with]
enabled = true

[capabilities.string.ends_with]
enabled = true

[capabilities.string.upper]
enabled = true

[capabilities.string.lower]
enabled = true

[capabilities.string.join]
enabled = true

[capabilities.regex.matches]
enabled = true

[capabilities.regex.replace]
enabled = true

[capabilities.json.parse]
enabled = true

[capabilities.json.to_string]
enabled = true

[capabilities.json.get]
enabled = true

[capabilities.json.keys]
enabled = true

[capabilities.json.length]
enabled = true

[capabilities.hash.blake3.hash]
enabled = true

[capabilities.path.join]
enabled = true

[capabilities.filesystem.read_text]
enabled = true
folders = ["."]

[capabilities.filesystem.read_bytes]
enabled = true
folders = ["."]

[capabilities.filesystem.exists]
enabled = true
folders = ["."]

[capabilities.filesystem.list_entries]
enabled = true
folders = ["."]

[capabilities.filesystem.is_directory]
enabled = true
folders = ["."]

[capabilities.filesystem.is_regular_file]
enabled = true
folders = ["."]

[capabilities.filesystem.glob_matches]
enabled = true
folders = ["."]

[capabilities.filesystem.walk]
enabled = true
folders = ["."]

[capabilities.filesystem.write_text]
enabled = true
folders = ["./docs"]

[capabilities.filesystem.create_directory]
enabled = true
folders = ["./docs"]

