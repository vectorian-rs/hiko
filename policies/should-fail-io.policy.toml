# Intentionally tiny I/O budget for limit-failure examples.
# Use with examples/should_fail_io_*.hml to verify that byte-charged
# host-boundary operations fail cleanly once they exceed the configured limit.

[limits]
max_work = 10_000_000
max_io_bytes = 4
max_heap = 100_000

[capabilities.stdio.println]
enabled = true

[capabilities.stdio.read_stdin]
enabled = true

[capabilities.filesystem.read_text]
enabled = true
folders = ["."]

[capabilities.filesystem.read_bytes]
enabled = true
folders = ["."]

[capabilities.filesystem.write_text]
enabled = true
folders = ["."]

[capabilities.filesystem.list_entries]
enabled = true
folders = ["."]

[capabilities.filesystem.glob_matches]
enabled = true
folders = ["."]

[capabilities.filesystem.walk]
enabled = true
folders = ["."]

# The Filesystem module body names every filesystem builtin, so importing it
# needs each leaf registered; the io limit above still fails the operations.
[capabilities.filesystem.exists]
enabled = true
folders = ["."]

[capabilities.filesystem.remove]
enabled = true
folders = ["."]

[capabilities.filesystem.create_directory]
enabled = true
folders = ["."]

[capabilities.filesystem.is_directory]
enabled = true
folders = ["."]

[capabilities.filesystem.is_regular_file]
enabled = true
folders = ["."]

# Filesystem.join wraps the path builtin.
[capabilities.path.join]
enabled = true

# The Stdio module body names every stdio builtin.
[capabilities.stdio.print]
enabled = true

[capabilities.stdio.eprint]
enabled = true

[capabilities.stdio.eprintln]
enabled = true

[capabilities.stdio.read_line]
enabled = true
