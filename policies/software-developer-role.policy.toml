# Software developer role policy.
# Broad local scripting profile for this repository:
# - full filesystem access under .
# - localhost HTTP for package serving and local services
# - wide command whitelist for repo automation

[limits]
max_fuel = 100_000_000
max_heap = 1_000_000
exec_timeout_ms = 60000

[capabilities.stdio.print]
enabled = true

[capabilities.stdio.println]
enabled = true

[capabilities.stdio.eprint]
enabled = true

[capabilities.stdio.eprintln]
enabled = true

[capabilities.stdio.read_line]
