# Run config for examples/sre/cloudwatch_alarms.hml: read CloudWatch alarms with one SSO
# profile, print the report, exit with its status. The policy covers the running program,
# which cannot read the environment, files or the network beyond CloudWatch. Modules load
# before it applies, until #187.

[capabilities.stdio.println]
enabled = true

[capabilities.convert.int_to_string]
enabled = true

[capabilities.string.string_length]
enabled = true

[capabilities.string.string_join]
enabled = true

[capabilities.string.string_replace]
enabled = true

[capabilities.system.exit]
enabled = true

[extensions.aws]
sso_profiles = ["dev"]   # the profile the script names
cloudwatch = true
