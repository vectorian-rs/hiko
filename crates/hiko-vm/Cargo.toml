[package]
name = "hiko-vm"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "hiko-vm: part of the hiko ML-family scripting language"
repository = "https://github.com/vectorian-rs/hiko"

[features]
# Count executed opcodes and opcode pairs (HIKO_OPCODE_STATS=<path>); slow.
opcode-stats = []
# Untimed cumulative heap estimates; no script capability is enabled.
heap-metrics = ["dep:serde_json"]
# Run functions that translate to register code on the register VM (#155);
# off by default while it is measured. `opcode-stats` counts only the
# instructions the stack VM runs.
register-vm = []
default = ["builtin-default"]
# The default build leaves out regex, JSON and dates; see PR #141.
builtin-default = [
    "builtin-stdio",
    "builtin-convert",
    "builtin-string",
    "builtin-math",
    "builtin-bytes",
    "builtin-hash",
    "builtin-random",
    "builtin-env",
    "builtin-time",
    "builtin-process",
    "builtin-path",
    "builtin-filesystem",
    "builtin-http",
    "builtin-exec",
    "builtin-system",
    "builtin-testing",
]
builtin-all = [
    "builtin-default",
    "builtin-regex",
    "builtin-json",
    "builtin-date",
]
builtin-stdio = ["hiko-builtin-meta/builtin-stdio", "hiko-compile/builtin-stdio"]
builtin-convert = ["hiko-builtin-meta/builtin-convert", "hiko-compile/builtin-convert"]
builtin-string = ["hiko-builtin-meta/builtin-string", "hiko-compile/builtin-string"]
builtin-regex = [
    "hiko-builtin-meta/builtin-regex",
    "hiko-compile/builtin-regex",
    "dep:regex",
]
builtin-json = [
    "hiko-builtin-meta/builtin-json",
    "hiko-compile/builtin-json",
    "dep:serde_json",
]
builtin-math = ["hiko-builtin-meta/builtin-math", "hiko-compile/builtin-math"]
builtin-bytes = ["hiko-builtin-meta/builtin-bytes", "hiko-compile/builtin-bytes"]
builtin-hash = [
    "hiko-builtin-meta/builtin-hash",
    "hiko-compile/builtin-hash",
    "hiko-common/hash",
]
builtin-random = [
    "hiko-builtin-meta/builtin-random",
    "hiko-compile/builtin-random",
    "dep:getrandom",
]
builtin-env = ["hiko-builtin-meta/builtin-env", "hiko-compile/builtin-env"]
builtin-time = [
    "hiko-builtin-meta/builtin-time",
    "hiko-compile/builtin-time",
]
builtin-date = [
    "hiko-builtin-meta/builtin-date",
    "hiko-compile/builtin-date",
    "dep:jiff",
]
builtin-process = ["hiko-builtin-meta/builtin-process", "hiko-compile/builtin-process"]
builtin-path = ["hiko-builtin-meta/builtin-path", "hiko-compile/builtin-path"]
builtin-filesystem = [
    "hiko-builtin-meta/builtin-filesystem",
    "hiko-compile/builtin-filesystem",
    "dep:cap-std",
    "dep:glob",
]
builtin-http = [
    "hiko-builtin-meta/builtin-http",
    "hiko-compile/builtin-http",
    "hiko-common/http",
    "dep:rmp-serde",
    "dep:serde_json",
]
builtin-exec = ["hiko-builtin-meta/builtin-exec", "hiko-compile/builtin-exec"]
builtin-system = ["hiko-builtin-meta/builtin-system", "hiko-compile/builtin-system"]
builtin-testing = ["hiko-builtin-meta/builtin-testing", "hiko-compile/builtin-testing"]

[dependencies]
hiko-builtin-meta = { version = "0.8.0", path = "../hiko-builtin-meta", default-features = false }
hiko-common = { version = "0.8.0", path = "../hiko-common", default-features = false }
hiko-compile = { version = "0.8.0", path = "../hiko-compile", default-features = false }
hiko-syntax = { version = "0.8.0", path = "../hiko-syntax" }
dashmap = "6"
getrandom = { version = "0.3", optional = true }
glob = { version = "0.3", optional = true }
smallvec = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"], optional = true }
rmp-serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
regex = { version = "1", optional = true }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
cap-std = { version = "4", optional = true }

[target.'cfg(unix)'.dependencies]
# Kill the process group of a timed-out `exec` child, and open files with
# `O_RESOLVE_BENEATH` on macOS (see `builtins/filesystem.rs`).
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
hiko-types = { version = "0.8.0", path = "../hiko-types", default-features = false, features = ["check-generalization"] }
hiko-common = { version = "0.8.0", path = "../hiko-common", default-features = false, features = ["hash"] }
hiko-compile = { version = "0.8.0", path = "../hiko-compile", default-features = false, features = ["loader-all"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
sortedvec = "0.5"

# Model checking of the threaded runtime: RUSTFLAGS="--cfg loom".
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[[bench]]
name = "vm_bench"
harness = false

[[bench]]
name = "sorted_collections_bench"
harness = false

# Targets that use builtins outside the core build only when their domains
# are enabled, so the crate also checks with `--no-default-features`.
[[example]]
name = "fs_open_cost"
required-features = ["builtin-filesystem", "builtin-stdio"]

[[example]]
name = "host_work_calibration"
required-features = ["builtin-all"]
test = true

[[example]]
name = "process_creation_cost"
required-features = ["builtin-filesystem", "builtin-process", "builtin-stdio"]

[[test]]
name = "extension"
required-features = ["builtin-convert", "builtin-process", "builtin-stdio"]

[[test]]
name = "io_limits"
required-features = ["builtin-exec", "builtin-filesystem", "builtin-http", "builtin-process"]
